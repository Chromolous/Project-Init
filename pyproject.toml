[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "project-init"
version = "1.0.0"
authors = [
  { name="Chromolous", email="alexmachadofm@gmail.com" },
]
description = "Gerador de projetos de programação"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["questionary>=2.0.0"]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/Chromolous/Project-Init"
Issues = "https://github.com/Chromolous/Project-Init/issues"

[project.scripts]
pinit = "pinit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
